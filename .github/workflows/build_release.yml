name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # ручной запуск

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----- При ручном запуске пересоздаём последний тег -----
      - name: Recreate latest tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "В репозитории нет тегов. Создайте первый тег вручную (например, v1.0.0) и повторите."
            exit 1
          fi
          echo "Последний тег: $TAG"

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          git tag "$TAG"
          git push origin "$TAG"

          git fetch --tags
          git checkout "$TAG"

          # Сохраняем имя тега для последующих шагов
          echo "RECREATED_TAG=$TAG" >> $GITHUB_ENV

      # ----- Генерация version info -----
      - name: Generate version info file
        shell: powershell
        run: |
          # При ручном запуске берём из переменной окружения, иначе из ref_name
          $envTag = "$env:RECREATED_TAG"
          if ($envTag) {
              $tag = $envTag
          } else {
              $tag = "${{ github.ref_name }}"
          }
          Write-Host "Using tag: $tag"
          $ver = $tag -replace '^v', ''
          if ($ver -match '^(\d+\.\d+\.\d+)') {
              $base = $matches[1]
              $parts = $base.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2]
              $suffix = $ver.Substring($base.Length)
              $build = 0
              if ($suffix -match 'b(\d+)') { $build = [int]$matches[1] }

              $lines = @(
                  "# UTF-8",
                  "VSVersionInfo(",
                  "  ffi=FixedFileInfo(",
                  "    filevers=($major, $minor, $patch, $build),",
                  "    mask=0x3f,",
                  "    flags=0x0,",
                  "    OS=0x4,",
                  "    fileType=0x1,",
                  "    subtype=0x0,",
                  "    date=(0, 0)",
                  "  ),",
                  "  kids=[",
                  "    StringFileInfo(",
                  "      [",
                  "        StringTable(",
                  "          u'040904B0',",
                  "          [",
                  "            StringStruct(u'FileDescription', u'SpeedVideoJoiner'),",
                  "            StringStruct(u'InternalName', u'SpeedVideoJoiner'),",
                  "            StringStruct(u'ProductVersion', u'$tag'),",
                  "            StringStruct(u'ProductName', u'SpeedVideoJoiner'),",
                  "            StringStruct(u'LegalCopyright', u'(c) dimak222')",
                  "          ]",
                  "        )",
                  "      ]",
                  "    ),",
                  "    VarFileInfo([VarStruct(u'Translation', [1049, 1033])])",
                  "  ]",
                  ")"
              )
              $content = $lines -join "`r`n"
              Set-Content -Path version_info.txt -Value $content -Encoding UTF8
          } else {
              Write-Error "Не удалось извлечь версию из тега $tag"
              exit 1
          }

      # ----- Установка Python и зависимостей -----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ----- Сборка EXE -----
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --version-file=version_info.txt --name SpeedVideoJoiner SpeedVideoJoiner.pyw

      # ----- Загрузка в релиз -----
      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpeedVideoJoiner.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}